<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Evening city story</title>
  <desc id="desc">A warm illustrated city skyline at sunset.</desc>
